name: Release BitChat Plus

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag (e.g. v1.0.0)
        required: true
        type: string
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  JAVA_VERSION: 21.0.11+10

jobs:
  release:
    name: Build and release signed APK
    runs-on: ubuntu-24.04

    steps:
      - name: Validate release tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "error: release tag must look like vX.Y.Z" >&2
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up pinned JDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up and validate Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Update version from tag
        run: |
          VERSION="${RELEASE_TAG#v}"
          echo "Building version $VERSION"
          sed -i "s/versionName = \".*\"/versionName = \"$VERSION\"/" app/build.gradle.kts

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > ${{ runner.temp }}/release.keystore

      - name: Build signed release APK
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=${{ runner.temp }}/release.keystore \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEYSTORE_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEYSTORE_PASSWORD }}

      - name: Find and rename APK
        id: apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          cp "$APK_PATH" "BitChat-Plus.apk"
          echo "apk_path=BitChat-Plus.apk" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "BitChat Plus ${{ env.RELEASE_TAG }}"
          body: |
            ## BitChat Plus ${{ env.RELEASE_TAG }}

            Privacy-first Bluetooth mesh messenger. No location required.

            ### Features
            - Bluetooth-only operation (no location required)
            - Dark blue theme
            - Optional location sharing with direction, distance, and map link
            - Private chat with long-press on username
            - Made by jnetai.com

            ### Install
            Download the APK below and install on your Android device.
          files: BitChat-Plus.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
